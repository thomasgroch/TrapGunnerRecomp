# Desktop releases for RecompLauncher (Linux + Windows).
#
# Builds the MIT Zig PS1 core (web/src) as an SDL2 desktop app. The binaries
# contain no game code or assets: the player points RecompLauncher (or the
# command line) at their own Trap Gunner (USA) disc image.
#
# Run: push a tag `vX.Y.Z`, or Actions → "Release builds" → Run workflow.
name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (X.Y.Z). A tag vX.Y.Z and a GitHub Release are created.'
        required: true

permissions:
  contents: write

env:
  ZIG_VERSION: 0.17.1
  SDL_VERSION: 2.30.9

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
          - name: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: '${{ env.ZIG_VERSION }}' }

      - name: Linux build (system SDL2, bundled next to the binary)
        if: matrix.name == 'linux-x64'
        working-directory: web
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-dev
          zig build desktop -Doptimize=ReleaseFast \
            -Dsdl-include=/usr/include/SDL2 -Dsdl-lib=/usr/lib/x86_64-linux-gnu
          mkdir -p ../stage
          cp zig-out/bin/TrapGunner_Recompiled ../stage/
          cp -L /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0 ../stage/

      - name: Windows build (cross-compiled, SDL2 mingw SDK)
        if: matrix.name == 'windows-x64'
        working-directory: web
        run: |
          curl -fsSL -o sdl.tgz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-devel-${SDL_VERSION}-mingw.tar.gz"
          tar xzf sdl.tgz
          SDK="$PWD/SDL2-${SDL_VERSION}/x86_64-w64-mingw32"
          zig build desktop -Doptimize=ReleaseFast -Dtarget=x86_64-windows-gnu \
            -Dsdl-include="$SDK/include/SDL2" -Dsdl-lib="$SDK/lib"
          mkdir -p ../stage
          cp zig-out/bin/TrapGunner_Recompiled.exe ../stage/
          cp "$SDK/bin/SDL2.dll" ../stage/

      - name: Package
        run: |
          cp LICENSE web/www/OpenBIOS.LICENSE recomplauncher.json stage/
          printf '%s\n' \
            'Trap Gunner Recompiled (desktop)' \
            '' \
            'Use RecompLauncher (recomplauncher.com), or run:' \
            '  TrapGunner_Recompiled --disc "Trap Gunner.cue"' \
            'Options: --skip-fmv, --fullscreen (F11 / Alt+Enter toggles).' \
            'Keys: arrows, X=Cross Z=Circle S=Square A=Triangle, Enter=Start, Shift=Select, Q/W=L1/R1, E/R=L2/R2.' \
            'Gamepads are supported (two for VS mode).' \
            '' \
            'No game data is included: you need your own Trap Gunner (USA) disc image.' > stage/README.txt
          cd stage && zip -r9 "../TrapGunner_Recompiled-${{ matrix.name }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: TrapGunner_Recompiled-${{ matrix.name }}
          path: TrapGunner_Recompiled-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Trap Gunner Recompiled ${{ steps.tag.outputs.tag }}
          files: TrapGunner_Recompiled-*.zip
          body: |
            Desktop builds for **Linux** and **Windows**, ready for [RecompLauncher](https://recomplauncher.com).
            They run the open-source (MIT) PS1 core with OpenBIOS. **No game data is included**: point the launcher at your own Trap Gunner (USA) disc image (.cue/.bin).
            Browser version: https://trapgunner.pages.dev
