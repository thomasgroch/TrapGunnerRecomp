name: CI
on: [push, pull_request]
jobs:
  tgtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build test
        working-directory: tools/tgtool
      - run: zig build -Doptimize=ReleaseFast
        working-directory: tools/tgtool
